[project]
name = "agent-economy-e2e"
version = "0.1.0"
description = "Agent-ready ecommerce MCP sandbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.0",
    "rich>=13.9.0",
    "streamlit>=1.40.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
ecommerce-mcp = "agent_economy_e2e.ecommerce.mcp.server:main"
payment-gateway-mcp = "agent_economy_e2e.payment_gateway.server:main"
app = "agent_economy_e2e.main:main"
purchase-agent = "agent_economy_e2e.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/agent_economy_e2e/**/*.py",
    "src/agent_economy_e2e/**/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_economy_e2e"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_economy_e2e/ecommerce/database/seed_catalog.json" = "agent_economy_e2e/ecommerce/database/seed_catalog.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
