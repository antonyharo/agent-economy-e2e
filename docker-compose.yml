services:
  mini-pix:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn agent_economy_e2e.mini_pix.app:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    environment:
      MINI_PIX_DATA_DIR: /app/data/mini-pix
    ports:
      - "8001:8001"
    volumes:
      - ./data/mini-pix:/app/data/mini-pix
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/openapi.json', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mini-bank:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn agent_economy_e2e.mini_bank.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      MINI_BANK_DATA_DIR: /app/data/mini-bank
      MINI_PIX_URL: http://mini-pix:8001
    ports:
      - "8000:8000"
    volumes:
      - ./data/mini-bank:/app/data/mini-bank
    depends_on:
      mini-pix:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/accounts/buyer/balance', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
